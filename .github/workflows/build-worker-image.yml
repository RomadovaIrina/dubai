# Manual (workflow_dispatch) build + push of the DabAI Serverless worker image to GHCR.
# Never runs automatically. Requires no extra secrets: GITHUB_TOKEN can push to ghcr.io/<owner>/dabai-worker.
# NOTE: the image is ~10 GB; hosted runners have ~14 GB free, hence the disk-cleanup step. A Docker-capable RunPod Pod
# (or any workstation) running infra/serverless/build.sh is the simpler path.
name: build-worker-image
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "image tag (default: sha-<short sha>)"
        required: false
        default: ""
permissions:
  contents: read
  packages: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Free disk space
        uses: jlumbroso/free-disk-space@v1.3.1
        with:
          tool-cache: true
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          swap-storage: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Compute image name
        id: meta
        run: |
          owner="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          tag="${{ github.event.inputs.tag }}"; [ -n "$tag" ] || tag="sha-${GITHUB_SHA::12}"
          echo "image=ghcr.io/${owner}/dabai-worker:${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: infra/serverless/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.image }}
          build-args: |
            GIT_SHA=${{ github.sha }}
            BUILD_DATE=${{ github.event.repository.updated_at }}
            IMAGE_REF=${{ steps.meta.outputs.image }}
      - run: echo "pushed ${{ steps.meta.outputs.image }}"
